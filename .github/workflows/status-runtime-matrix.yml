name: Status runtime matrix

on:
  pull_request:

permissions:
  contents: read

jobs:
  node-status:
    name: Node 22 status tests (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Hydrate locked CI dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run focused status tests
        run: node --test test/status-loader.test.mjs
      - name: Run full test suite
        run: npm test

  python-jcs-reference:
    name: Python 3.12 JCS reference (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test independent verifier
        run: python -m unittest discover -s test -p "test_status_jcs_reference.py"
      - name: Verify fixed JCS vectors
        run: python scripts/verify_status_jcs.py
