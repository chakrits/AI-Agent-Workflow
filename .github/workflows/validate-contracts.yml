name: Validate workflow contracts
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Select and run applicable validations
        run: node scripts/run-scoped-validations.mjs
        env:
          VALIDATION_PROVIDER: github
          VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          VALIDATION_HEAD_SHA: ${{ github.sha }}
          # Only validate:dispatch-receipts receives this read-only token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
