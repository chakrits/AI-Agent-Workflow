name: Validate workflow contracts
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run validate:contracts
      - run: npm run validate:dispatch-receipts
        env:
          # ADR-0013 Control 3.3: live-verifies GitHub-comment-URL terminal_result_id
          # evidence via the GitHub API. Read-only, same-repository comments only.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run housekeeping:worktrees
      - run: npm run validate:skill-parity
      - run: npm run adr:audit
      - run: npm run validate:risk-register
      - run: npm run validate:review-gate
      - run: npm run validate:skill-usage
      - run: npm run validate:metrics
      - run: npm run validate:context-budget
