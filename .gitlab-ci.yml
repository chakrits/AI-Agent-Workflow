image: node:22

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
    - when: never

stages:
  - validate

validate:
  stage: validate
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - |
      export VALIDATION_PROVIDER=gitlab
      export VALIDATION_HEAD_SHA="$CI_COMMIT_SHA"
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        export VALIDATION_BASE_SHA="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      else
        export VALIDATION_BASE_SHA="$CI_COMMIT_BEFORE_SHA"
      fi
      node scripts/run-scoped-validations.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
